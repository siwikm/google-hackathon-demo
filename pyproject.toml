[project]
name = "google-hackathon-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "google-adk==2.14.0",
    "google-cloud-bigquery>=3.47.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 110
